<!DOCTYPE html>
<html>
<head>
    <title>Shop | TWONONE</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar">

<a href="index.html" class="logo">TWONONE</a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main class="page-content">
        <h1>Shop TWONONE</h1>
        <p>Premium No-Gi apparel made to perform on every round.</p>

        <section class="product-card">

            <div class="product-viewer" id="productViewer">
    <img class="product-front"
         src="images/rashguard-front.jpeg"
         alt="Front of the TWONONE rashguard">

    <img class="product-back"
         src="images/rashguard-back.jpeg"
         alt="Back of the TWONONE rashguard">
</div>

            <div>
                <h2>TWONONE Competition Rashguard</h2>
                <p>Built with durable, flexible performance fabric for training and competition.</p>
                <div class="product-options">
    <label for="size"><strong>Size:</strong></label>

    <select id="size" name="size">
        <option value="">Choose a size</option>
        <option value="Small">Small</option>
        <option value="Medium">Medium</option>
        <option value="Large">Large</option>
        <option value="X-Large">X-Large</option>
    </select>

    <label for="quantity"><strong>Quantity:</strong></label>

    <input id="quantity" name="quantity" type="number" value="1" min="1">

    <p class="price">CA$29.99</p>

    <button type="button" onclick="addToCart()">Add to Cart</button>
</div>
            </div>
        </section>
    </main>

    <script>
    const productViewer = document.getElementById("productViewer");

    productViewer.addEventListener("click", function () {
        productViewer.classList.toggle("show-back");
    });
    function addToCart() {
    const size = document.getElementById("size").value;
    const quantity = document.getElementById("quantity").value;

    if (size === "") {
        alert("Please choose a size.");
        return;
    }

    alert(quantity + " TWONONE Competition Rashguard(s), size " + size + " selected. Online checkout is coming soon.");
    
}
</script>


</body>
</html>
